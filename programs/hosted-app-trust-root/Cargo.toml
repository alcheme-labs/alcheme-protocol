[package]
name = "hosted-app-trust-root"
version = "0.1.0"
license = "Apache-2.0"
description = "Hosted App Trust Root Program for Alcheme Protocol Route B"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hosted_app_trust_root"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
solana-program = "^2.0"
alcheme-shared = { path = "../../shared" }

[dev-dependencies]
solana-program-test = "2.3.0"
solana-sdk = "2.3.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
